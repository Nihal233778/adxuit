<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tap Game with Ads</title>
    <!-- Telegram WebApp API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- ADSXUIT SDK -->
    <script src="https://adsxuit.com/sdk.js" app_id="HK5VUYHOGH38JRJI"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #1a1a2e;
            color: white;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .score-container {
            text-align: center;
            margin-bottom: 20px;
        }

        .score {
            font-size: 48px;
            font-weight: bold;
            line-height: 1;
            margin-bottom: 5px;
        }

        .label {
            font-size: 14px;
            opacity: 0.6;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .energy-bar {
            width: 80%;
            max-width: 300px;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin: 20px 0;
            overflow: hidden;
        }

        .energy-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            border-radius: 4px;
            transition: width 0.1s linear;
        }

        .tap-area {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #3a7bd5, #1a1a2e);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 64px;
            cursor: pointer;
            box-shadow: 0 0 40px rgba(58, 123, 213, 0.3), inset 0 0 20px rgba(0, 0, 0, 0.5);
            transition: transform 0.05s ease;
            position: relative;
        }

        .tap-area:active {
            transform: scale(0.95);
        }

        .tap-area.cooldown {
            opacity: 0.5;
            pointer-events: none;
        }

        .ad-button {
            margin-top: 30px;
            background: linear-gradient(90deg, #f7971e, #ffd200);
            border: none;
            color: #1a1a2e;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .ad-button:active {
            opacity: 0.8;
        }

        .ad-button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .floating-text {
            position: absolute;
            font-size: 24px;
            font-weight: bold;
            color: #ffd200;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-80px); }
        }

        .notification {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 9999;
        }

        .notification.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="score-container">
        <div class="score" id="scoreDisplay">0</div>
        <div class="label">Coins</div>
    </div>

    <div class="energy-bar">
        <div class="energy-fill" id="energyFill"></div>
    </div>

    <div class="tap-area" id="tapButton">
        👆
    </div>

    <button class="ad-button" id="watchAdBtn">🎬 Watch Ad for 500</button>

    <div class="notification" id="notification"></div>

    <script>
        // --- 1. INITIALIZATION ---
        let tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // --- 2. GAME STATE ---
        let score = 0;
        let energy = 1000;
        const MAX_ENERGY = 1000;
        const TAP_COST = 1;
        const TAP_REWARD = 10;
        const ENERGY_REGEN_RATE = 1;
        const AD_REWARD = 500;

        // --- 3. DOM ELEMENTS ---
        const scoreDisplay = document.getElementById('scoreDisplay');
        const energyFill = document.getElementById('energyFill');
        const tapButton = document.getElementById('tapButton');
        const watchAdBtn = document.getElementById('watchAdBtn');
        const notification = document.getElementById('notification');

        // --- 4. UI FUNCTIONS ---
        function updateUI() {
            scoreDisplay.textContent = score.toLocaleString();
            const energyPercent = (energy / MAX_ENERGY) * 100;
            energyFill.style.width = Math.max(0, energyPercent) + '%';
            if (energy < TAP_COST) {
                tapButton.classList.add('cooldown');
            } else {
                tapButton.classList.remove('cooldown');
            }
        }

        function showNotification(msg) {
            notification.textContent = msg;
            notification.classList.add('show');
            setTimeout(() => notification.classList.remove('show'), 2500);
        }

        function awardAdReward() {
            score += AD_REWARD;
            updateUI();
            if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            showNotification(`You earned ${AD_REWARD} coins!`);
            watchAdBtn.textContent = '🎬 Watch Ad for 500';
            setTimeout(() => { watchAdBtn.disabled = false; }, 3000);
        }

        // --- 5. TAP HANDLER ---
        function createFloatingText(event) {
            const rect = tapButton.getBoundingClientRect();
            const x = event.clientX || (rect.left + rect.width / 2);
            const y = event.clientY || (rect.top + rect.height / 2);
            const floatDiv = document.createElement('div');
            floatDiv.className = 'floating-text';
            floatDiv.textContent = `+${TAP_REWARD}`;
            floatDiv.style.left = `${x}px`;
            floatDiv.style.top = `${y}px`;
            document.body.appendChild(floatDiv);
            setTimeout(() => floatDiv.remove(), 800);
        }

        function handleTap(event) {
            if (energy < TAP_COST) return;
            energy -= TAP_COST;
            score += TAP_REWARD;
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            createFloatingText(event);
            updateUI();
        }

        tapButton.addEventListener('pointerdown', handleTap);

        // --- 6. ENERGY REGEN ---
        setInterval(() => {
            if (energy < MAX_ENERGY) {
                energy = Math.min(MAX_ENERGY, energy + ENERGY_REGEN_RATE);
                updateUI();
            }
        }, 1000);

        // --- 7. ADSXUIT AD INTEGRATION ---
        // The SDK hooks into document clicks automatically, but it also exposes
        // AdsXUIT.reward(callback) which fires the ad and runs your callback when
        // the ad closes. This is the clean way to grant rewards.
        watchAdBtn.addEventListener('click', () => {
            watchAdBtn.disabled = true;
            watchAdBtn.textContent = 'Loading ad...';

            if (typeof window.AdsXUIT === 'undefined') {
                // SDK didn't load — fail gracefully
                watchAdBtn.textContent = '🎬 Watch Ad for 500';
                watchAdBtn.disabled = false;
                showNotification('Ad service unavailable');
                return;
            }

            // Prefetch the network to warm it up, then show reward ad
            window.AdsXUIT.init(() => {
                window.AdsXUIT.reward(() => {
                    // This callback runs when the ad overlay is closed
                    awardAdReward();
                });
            });

            // Safety net: if ad never fires within 8s, re-enable button
            setTimeout(() => {
                if (watchAdBtn.disabled && watchAdBtn.textContent === 'Loading ad...') {
                    watchAdBtn.textContent = '🎬 Watch Ad for 500';
                    watchAdBtn.disabled = false;
                    showNotification('Ad failed to load');
                }
            }, 8000);
        });

        // --- 8. INIT ---
        updateUI();
    </script>
</body>
</html>
